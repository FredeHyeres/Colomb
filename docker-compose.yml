services:

  db:
    image: postgres:16
    container_name: colombo_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: colombo_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8001:8000"

  pgadmin:
    image: dpage/pgadmin4
    container_name: colombo_pgadmin
    restart: always
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@colombo.fr
      PGADMIN_DEFAULT_PASSWORD: admin2024
    ports:
      - "5052:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  frontend:
      image: nginx:alpine
      container_name: colombo_frontend
      volumes:
        - ./frontend:/usr/share/nginx/html
      ports:
        - "8080:80"
      depends_on:
        - backend

volumes:
  postgres_data:
  uploads_data:
  pgadmin_data: