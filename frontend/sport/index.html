<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colomb Sport</title>
  <link rel="stylesheet" href="sport.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🏆</span>
      <span class="logo-text">Colomb Sport</span>
    </div>

    <a href="../index.html" class="sidebar-back">
      ← Retour Élevage
    </a>

    <nav class="sidebar-nav">
      <div class="nav-section">Général</div>
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">🏆</span><span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="sessions">
        <span class="nav-icon">🏃</span><span>Séances</span>
      </a>
      <a href="#" class="nav-item" data-page="history">
        <span class="nav-icon">📊</span><span>Historique pigeon</span>
      </a>

      <div class="nav-section">Nutrition</div>
      <a href="#" class="nav-item" data-page="nutrition">
        <span class="nav-icon">🌾</span><span>Nutrition</span>
      </a>
      <a href="#" class="nav-item" data-page="plans">
        <span class="nav-icon">📋</span><span>Plans alimentaires</span>
      </a>

      <div class="nav-section">Intelligence</div>
      <a href="#" class="nav-item" data-page="analytics">
        <span class="nav-icon">📈</span><span>Analytics</span>
      </a>
      <a href="#" class="nav-item" data-page="ai">
        <span class="nav-icon">🤖</span><span>Recommandations IA</span>
      </a>
      <a href="#" class="nav-item" data-page="condition">
        <span class="nav-icon">💪</span><span>Condition sportive</span>
      </a>
      <a href="#" class="nav-item" data-page="colony">
        <span class="nav-icon">🕊️</span><span>Monitoring colonie</span>
      </a>
    </nav>
  </aside>

  <!-- Overlay mobile -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <h1 class="page-title" id="page-title">Dashboard Sport</h1>
      </div>
      <div class="topbar-actions">
        <input type="text" class="search-input" id="search-input" placeholder="Rechercher...">
        <button class="btn btn-primary" id="btn-add" style="display:none;">+ Ajouter</button>
      </div>
    </header>

    <div class="content" id="content">
      <div class="loader-spinner"></div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title">Titre</h2>
        <button id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Scripts (ordre de chargement important) -->
  <script src="js/sport-api.js"></script>
  <script src="js/sport-dashboard.js"></script>
  <script src="js/sport-sessions.js"></script>
  <script src="js/sport-history.js"></script>
  <script src="js/sport-nutrition.js"></script>
  <script src="js/sport-analytics.js"></script>
  <script src="js/sport-ai.js"></script>
  <script src="js/sport-condition.js"></script>
  <script src="js/sport-colony.js"></script>
  <script src="js/sport-app.js"></script>

</body>
</html>
